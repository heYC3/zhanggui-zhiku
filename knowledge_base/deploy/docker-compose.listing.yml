# Listing 网站自己的容器。
# 数据库仍然用 deploy/docker-compose.yml。
# 卷持久由 GitHub Actions 的 volume 任务验证，本机可选 Docker。
#
# 在 knowledge_base 目录执行：
#   docker compose -f deploy/docker-compose.listing.yml up --build

services:
  listing-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.listing
    image: zhanggui-listing-agent:local
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      LISTING_RUNTIME_DIR: /app/listing_data/runtime
      LISTING_ACCOUNTS: ${LISTING_ACCOUNTS:?请先设置 LISTING_ACCOUNTS}
    volumes:
      - listing_runtime:/app/listing_data/runtime

volumes:
  listing_runtime:
