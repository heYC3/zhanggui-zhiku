[project]
name = "knowledge-base"
version = "0.1.0"
description = "掌柜智库：基于 LangGraph 的商品资料 RAG 问答与受控 Listing Agent"
requires-python = ">=3.11"
dependencies = [
    "grandalf>=0.8",
    "langchain>=1.2.13",
    "langchain-openai>=1.1.11",
    "langchain-text-splitters>=1.1.1",
    "langgraph>=1.1.3",
    "loguru>=0.7.3",
    "minio>=7.2.20",
    "numpy>=2.4.3",
    "pymilvus[milvus-lite,model]>=2.6.10",
    "pymongo>=4.16.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
    "flagembedding>=1.3.5",
    "modelscope>=1.35.1",
    "transformers>=4.45.0,<5.0.0",
    "uvicorn[standard]>=0.42.0",
    "fastapi>=0.135.2",
    "python-multipart>=0.0.22",
    "python-dotenv>=1.2.2",
    "openai-agents>=0.13.5",
    "dashscope>=1.25.16",
    "pypdf>=6.0,<7",
]

[tool.uv.sources]
# 这台电脑没有 NVIDIA 显卡，只允许 CPU 版 PyTorch
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
